name = "genl"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["Genl"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
autoImplicit = false
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.32.0"

# Heights on curves over number fields (the genuine height theory, Genl.Curves), which also
# brings lana-agents/belyi (curves as function fields). Development pin: local path.
[[require]]
name = "heights"
path = "../heights-wpht-curve"

[[lean_lib]]
name = "Genl"

[[lean_lib]]
name = "Challenge"

[[lean_lib]]
name = "Solution"
