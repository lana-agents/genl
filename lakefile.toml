name = "genl"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["Genl"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
autoImplicit = false
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.32.0"

# Heights on curves over number fields (the genuine height theory, Genl.Curves), which also
# brings lana-agents/belyi (curves as function fields).
[[require]]
name = "heights"
git = "https://github.com/lana-agents/heights"
rev = "f4379dbccc8cdc4faa894a236d5581a6a635c5b5"

[[lean_lib]]
name = "Genl"

[[lean_lib]]
name = "Challenge"

[[lean_lib]]
name = "Solution"
